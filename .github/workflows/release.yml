name: Release VRCT

on:
  push:
    tags:
      - 'v*' # タグが 'v' で始まる場合にトリガー (例: v1.0.0)
  # Build only, without publishing a release: checks that the app and the
  # NSIS installer still build, and keeps the installer as a run artifact.
  workflow_dispatch:

jobs:
  release:
    name: Build VRCT
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      IS_TAG: ${{ github.ref_type == 'tag' }}
      # GitHub rejects release assets of 2 GiB or more, so the packages are
      # split into parts of this size. src-tauri/nsis/template.nsi downloads
      # <zip>.001, <zip>.002, ... and joins them; <zip>.parts holds the count.
      PART_SIZE_BYTES: 1073741824
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        shell: pwsh
        run: |
          if ($env:IS_TAG -eq "true") {
            $version = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Determine release channel
        id: channel
        shell: pwsh
        run: |
          if ($env:VERSION -match "-(beta|rc)") {
            echo "is_beta=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            echo "is_beta=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Verify version numbers match the tag
        if: env.IS_TAG == 'true'
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $failed = $false

          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            Write-Host "::error::package.json version ($pkgVersion) does not match tag version ($expected)"
            $failed = $true
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $expected) {
            Write-Host "::error::src-tauri/tauri.conf.json version ($tauriVersion) does not match tag version ($expected)"
            $failed = $true
          }

          $configContent = Get-Content src-python/config.py -Raw
          if ($configContent -notmatch 'self\._VERSION\s*=\s*"([^"]+)"') {
            Write-Host "::error::could not find self._VERSION in src-python/config.py"
            $failed = $true
          } elseif ($Matches[1] -ne $expected) {
            Write-Host "::error::src-python/config.py VERSION ($($Matches[1])) does not match tag version ($expected)"
            $failed = $true
          }

          if ($failed) {
            Write-Host "::error::Version mismatch detected. Bump every version field to $expected before tagging."
            exit 1
          }

      - name: Verify build channel matches the version
        shell: pwsh
        run: |
          $isBeta = "${{ steps.channel.outputs.is_beta }}" -eq "true"
          $expectedChannel = if ($isBeta) { "beta" } else { "stable" }

          $content = Get-Content src-python/build_channel.py -Raw
          if ($content -notmatch 'BUILD_CHANNEL\s*=\s*"([^"]+)"') {
            Write-Host "::error::could not find BUILD_CHANNEL in src-python/build_channel.py"
            exit 1
          }
          $actualChannel = $Matches[1]

          if ($actualChannel -ne $expectedChannel) {
            Write-Host "::error::BUILD_CHANNEL is '$actualChannel' but version '$env:VERSION' implies '$expectedChannel'. Fix src-python/build_channel.py before tagging."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Setup Python environment
        run: npm run setup-python

      - name: Install Python script dependencies
        run: pip install tqdm

      - name: Build and package
        run: npm run release-all

      - name: Prepare release assets
        shell: pwsh
        run: |
          $dist = "./dist-release"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # The in-app updater and the installer look for this fixed name.
          $setup = "./src-tauri/target/release/bundle/nsis/VRCT_${{ env.VERSION }}_x64-setup.exe"
          Copy-Item -Path $setup -Destination "$dist/VRCT_setup.exe"
          $setupHash = (Get-FileHash -Path "$dist/VRCT_setup.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$dist/VRCT_setup.exe.sha256" -Value $setupHash -NoNewline -Encoding ascii

          $partSize = [long]$env:PART_SIZE_BYTES
          $buffer = New-Object byte[] (16MB)
          foreach ($zip in @("VRCT.zip", "VRCT_cuda.zip")) {
            # Checksum of the whole package; the installer checks it after joining the parts.
            $hash = (Get-FileHash -Path "./$zip" -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$dist/$zip.sha256" -Value $hash -NoNewline -Encoding ascii

            $in = [System.IO.File]::OpenRead((Resolve-Path "./$zip"))
            $count = 0
            try {
              while ($in.Position -lt $in.Length) {
                $count++
                $partPath = Join-Path (Resolve-Path $dist) ("{0}.{1:D3}" -f $zip, $count)
                $out = [System.IO.File]::Create($partPath)
                try {
                  $remaining = $partSize
                  while ($remaining -gt 0) {
                    $read = $in.Read($buffer, 0, [int][Math]::Min([long]$buffer.Length, $remaining))
                    if ($read -le 0) { break }
                    $out.Write($buffer, 0, $read)
                    $remaining -= $read
                  }
                } finally {
                  $out.Dispose()
                }
              }
            } finally {
              $in.Dispose()
            }
            Set-Content -Path "$dist/$zip.parts" -Value "$count" -NoNewline -Encoding ascii
            Write-Host "$zip -> $count part(s), sha256 $hash"
            # Free the runner's disk before the next package.
            Remove-Item -Path "./$zip"
          }

          Get-ChildItem $dist | Format-Table Name, Length

      - name: Keep the installer as a run artifact
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VRCT_setup_${{ env.VERSION }}
          path: |
            dist-release/VRCT_setup.exe
            dist-release/VRCT_setup.exe.sha256

      - name: Create GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # The in-app updater reads the release name as the version, so it
          # must be the bare version string.
          $releaseArgs = @(
            "release", "create", "${{ github.ref_name }}",
            "--repo", "${{ github.repository }}",
            "--verify-tag",
            "--title", $env:VERSION
          )
          if ("${{ steps.channel.outputs.is_beta }}" -eq "true") { $releaseArgs += "--prerelease" }
          $notes = "docs/release_notes_${{ github.ref_name }}.md"
          if (Test-Path $notes) { $releaseArgs += @("--notes-file", $notes) } else { $releaseArgs += "--generate-notes" }

          $assets = Get-ChildItem ./dist-release -File | ForEach-Object { $_.FullName }
          gh @releaseArgs @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
